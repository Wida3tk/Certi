<title>مراجعة قوالب الشهادات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* لوحة مراجعة: رأس كحلي بهوية سلوكيرا ثم شبكة بطاقات، كل بطاقة = قالب واحد بقرار واحد */
:root {
  --navy: #031233; --blue: #0C40FB; --bg: #F3F5FA; --card: #FFFFFF; --fg: #0E1A33; --muted: #5B6478; --line: #E2E7F1;
  --ok: #067647; --ok-bg: #E7F8EE; --warn: #9A4A06; --warn-bg: #FFF5E0; --err: #B42318; --err-bg: #FDECEA; --field: #FFFFFF;
  --font: 'IBM Plex Sans Arabic', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A1022; --card: #121A30; --fg: #E8ECF6; --muted: #9AA4BC; --line: #26304A; --blue: #5B7CFF;
  --ok: #5BD08F; --ok-bg: #0F2A1D; --warn: #F2B35B; --warn-bg: #2C2110; --err: #FF8A80; --err-bg: #2E1414; --field: #0D1428; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0A1022; --card: #121A30; --fg: #E8ECF6; --muted: #9AA4BC; --line: #26304A; --blue: #5B7CFF;
  --ok: #5BD08F; --ok-bg: #0F2A1D; --warn: #F2B35B; --warn-bg: #2C2110; --err: #FF8A80; --err-bg: #2E1414; --field: #0D1428; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.7; direction: rtl; }
.hero { background: radial-gradient(120% 160% at 85% -20%, #2522BF 0%, #1a2bd8 30%, #0B1168 58%, #031233 85%); color: #fff;
  margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 28px); padding-bottom: 28px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { margin: 0 0 6px; font-size: 30px; font-weight: 700; text-wrap: balance; }
.hero p { margin: 0; color: #D5DEFF; max-width: 70ch; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.stat { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 6px 14px; font-size: 14px; }
.stat b { font-size: 18px; margin-inline-start: 6px; font-variant-numeric: tabular-nums; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-block: 18px 6px; }
.bar button, .chip { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.bar button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
:root[data-theme="dark"] .bar button.on { background: var(--blue); border-color: var(--blue); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bar button.on { background: var(--blue); border-color: var(--blue); } }
.bar input { font: inherit; flex: 1; min-width: 200px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--field); color: var(--fg); }
.status { font-size: 13px; color: var(--muted); padding-bottom: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; padding-bottom: 40px; }
@media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card.d-approve { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok-bg); }
.card.d-fix { border-color: var(--warn); }
.card.d-skip { opacity: .62; }
.thumb { display: block; width: 100%; aspect-ratio: 3508 / 2480; background: #e9edf5; border: 0; padding: 0; cursor: zoom-in; }
.thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
.body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.en { font-weight: 600; direction: ltr; text-align: left; line-height: 1.45; }
.meta { font-size: 13px; color: var(--muted); }
.flag { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 500; }
label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 2px; }
.fields { display: grid; grid-template-columns: 1fr 110px 92px; gap: 8px; }
.fields > div { min-width: 0; }
input[type=text], select, textarea { width: 100%; font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); color: var(--fg); }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--blue) 35%, transparent); outline-offset: 1px; }
textarea { min-height: 38px; resize: vertical; }
.decide { display: flex; gap: 6px; margin-top: auto; padding-top: 6px; }
.decide button { flex: 1; font: inherit; font-size: 14px; font-weight: 600; border-radius: 10px; padding: 8px 6px; cursor: pointer; border: 1px solid var(--line); background: var(--field); color: var(--fg); }
.decide .a.on { background: var(--ok); color: #fff; border-color: var(--ok); }
.decide .f.on { background: var(--warn); color: #fff; border-color: var(--warn); }
.decide .s.on { background: var(--muted); color: #fff; border-color: var(--muted); }
.saved { font-size: 12px; color: var(--muted); min-height: 18px; }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }
dialog { border: 0; padding: 0; background: transparent; max-width: min(96vw, 1400px); }
dialog::backdrop { background: rgba(3, 18, 51, .8); }
dialog img { max-width: 100%; max-height: 90vh; display: block; border-radius: 8px; }
dialog button { position: absolute; top: 8px; left: 8px; font: inherit; border: 0; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s, box-shadow .15s, opacity .15s; } }
</style>

<header class="hero"><div class="wrap">
  <h1>مراجعة قوالب الشهادات</h1>
  <p>كل بطاقة قالب من مجلد «الدورات القصيرة» بعد تحويله، ومعه اسم تجريبي طويل وتاريخان ورمز QR. صحّحي الاسم العربي الذي يراه المتدرب، واختاري النوع، ثم اعتمدي أو اطلبي تعديلاً أو استبعدي. لا تُفعَّل في الموقع إلا القوالب المعتمدة.</p>
  <div class="stats" id="stats"></div>
</div></header>

<main class="wrap">
  <div class="bar" role="toolbar" aria-label="تصفية">
    <button data-f="all" class="on">الكل</button>
    <button data-f="todo">لم تُراجَع</button>
    <button data-f="flag">عليها ملاحظة</button>
    <button data-f="approve">معتمدة</button>
    <button data-f="fix">تحتاج تعديل</button>
    <button data-f="skip">مستبعدة</button>
    <input id="q" type="search" placeholder="بحث بالاسم العربي أو الإنجليزي">
  </div>
  <div class="status" id="status">جارٍ تحميل القرارات المحفوظة…</div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="zoom"><button id="zclose" type="button">إغلاق</button><img id="zimg" alt=""></dialog>

<script>
const $ = s => document.querySelector(s);
let ROWS = [], DEC = {}, FILTER = 'all', db = null, canWrite = true;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function dec(id) {
  const r = ROWS.find(x => x.id === id);
  return Object.assign({ nameAr: r.nameAr, type: r.type, minDays: r.minDays, decision: '', note: '' }, DEC[id] || {});
}
function stats() {
  const n = k => ROWS.filter(r => dec(r.id).decision === k).length;
  $('#stats').innerHTML = [['القوالب', ROWS.length], ['معتمدة', n('approve')], ['تحتاج تعديل', n('fix')], ['مستبعدة', n('skip')],
    ['لم تُراجَع', ROWS.length - n('approve') - n('fix') - n('skip')]].map(([k, v]) => '<span class="stat">' + k + '<b>' + v + '</b></span>').join('');
}
function card(r) {
  const d = dec(r.id);
  return '<article class="card d-' + (d.decision || 'none') + '" data-id="' + esc(r.id) + '">' +
    '<button class="thumb" type="button" aria-label="تكبير المعاينة"><img loading="lazy" src="thumbs/' + esc(r.id) + '.jpg" alt="معاينة ' + esc(r.titleEn) + '"></button>' +
    '<div class="body">' +
      '<div class="en">' + esc(r.titleEn) + '</div>' +
      '<div class="meta">الملف: ' + esc(r.file) + '.psd' + (r.trainer ? ' · المدرب: <span dir="ltr">' + esc(r.trainer) + '</span>' : (r.selfPaced ? ' · تعلّم ذاتي' : '')) +
        (r.ceu ? ' · <span dir="ltr">' + esc(r.ceu) + '</span>' : '') + '</div>' +
      (r.flag ? '<div class="flag">⚠ ' + esc(r.flag) + '</div>' : '') +
      '<div class="fields">' +
        '<div><label for="n-' + r.id + '">الاسم العربي للمتدرب</label><input type="text" id="n-' + r.id + '" data-k="nameAr" value="' + esc(d.nameAr) + '"></div>' +
        '<div><label for="t-' + r.id + '">النوع</label><select id="t-' + r.id + '" data-k="type"><option value="short"' + (d.type === 'short' ? ' selected' : '') + '>دورة قصيرة</option><option value="long"' + (d.type === 'long' ? ' selected' : '') + '>برنامج طويل</option></select></div>' +
        '<div><label for="m-' + r.id + '">أقل مدة</label><select id="m-' + r.id + '" data-k="minDays"><option value="0"' + (+d.minDays ? '' : ' selected') + '>بلا شرط</option><option value="10"' + (+d.minDays === 10 ? ' selected' : '') + '>10 أيام</option></select></div>' +
      '</div>' +
      '<div><label for="o-' + r.id + '">ملاحظة (اختياري)</label><textarea id="o-' + r.id + '" data-k="note" rows="1">' + esc(d.note) + '</textarea></div>' +
      '<div class="decide">' +
        '<button type="button" class="a' + (d.decision === 'approve' ? ' on' : '') + '" data-d="approve">✓ اعتماد</button>' +
        '<button type="button" class="f' + (d.decision === 'fix' ? ' on' : '') + '" data-d="fix">يحتاج تعديل</button>' +
        '<button type="button" class="s' + (d.decision === 'skip' ? ' on' : '') + '" data-d="skip">استبعاد</button>' +
      '</div><div class="saved" aria-live="polite"></div>' +
    '</div></article>';
}
function render() {
  const q = $('#q').value.trim().toLowerCase();
  const list = ROWS.filter(r => {
    const d = dec(r.id);
    if (FILTER === 'todo' && d.decision) return false;
    if (FILTER === 'flag' && !r.flag) return false;
    if (['approve', 'fix', 'skip'].includes(FILTER) && d.decision !== FILTER) return false;
    return !q || (d.nameAr + ' ' + r.titleEn + ' ' + r.file).toLowerCase().includes(q);
  });
  $('#grid').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">لا توجد قوالب في هذا التصنيف.</div>';
  stats();
}
async function save(id, patch, el) {
  DEC[id] = Object.assign(dec(id), patch, { updatedAt: new Date().toISOString() });
  const box = el && el.closest('.card') && el.closest('.card').querySelector('.saved');
  if (!db) { if (box) box.textContent = 'لم يُحفظ: الحفظ غير متاح في هذا العرض.'; return; }
  try { await db.doc('templates/' + id).set(DEC[id]); if (box) box.textContent = 'حُفظ'; }
  catch (e) { if (box) box.textContent = 'تعذّر الحفظ (' + (e && e.code || 'خطأ') + '). ليس لديك صلاحية التعديل على هذه الصفحة.'; }
}
$('#grid').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  if (e.target.closest('.thumb')) { $('#zimg').src = 'thumbs/' + c.dataset.id + '.jpg'; $('#zoom').showModal(); return; }
  const b = e.target.closest('[data-d]'); if (!b) return;
  const id = c.dataset.id, cur = dec(id).decision, next = cur === b.dataset.d ? '' : b.dataset.d;
  save(id, { decision: next }, b).then(() => {
    c.className = 'card d-' + (next || 'none');
    c.querySelectorAll('[data-d]').forEach(x => x.classList.toggle('on', x.dataset.d === next));
    stats();
  });
});
$('#grid').addEventListener('change', e => {
  const k = e.target.dataset.k; if (!k) return;
  const c = e.target.closest('.card');
  save(c.dataset.id, { [k]: k === 'minDays' ? +e.target.value : e.target.value.trim() }, e.target);
});
document.querySelectorAll('.bar button').forEach(b => b.onclick = () => {
  FILTER = b.dataset.f; document.querySelectorAll('.bar button').forEach(x => x.classList.toggle('on', x === b)); render();
});
$('#q').addEventListener('input', render);
$('#zclose').onclick = () => $('#zoom').close();
$('#zoom').addEventListener('click', e => { if (e.target === $('#zoom')) $('#zoom').close(); });

(async () => {
  try { ROWS = await (await fetch('rows.json')).json(); } catch (e) { $('#status').textContent = 'تعذّر تحميل قائمة القوالب.'; return; }
  render();
  const timer = setTimeout(() => { $('#status').textContent = 'القرارات تُعرض بدون حفظ (لم يستجب التخزين).'; }, 10000);
  try { db = window.claude ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { clearTimeout(timer); $('#status').textContent = 'هذا العرض لا يحفظ القرارات. افتحي الصفحة من claude.ai وأنتِ مسجّلة الدخول.'; return; }
  db.collection('templates').onSnapshot(snap => {
    clearTimeout(timer);
    DEC = {}; (snap.docs || []).forEach(d => { DEC[d.id] = d.data(); });
    const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest('.card');
    if (!focused) render(); else stats();
    $('#status').textContent = 'تُحفظ قراراتك تلقائياً، ويقرؤها Claude لتفعيل القوالب المعتمدة.';
  }, err => { clearTimeout(timer); $('#status').textContent = 'تعذّر تحميل القرارات المحفوظة.'; });
})();
</script>
